<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="320" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070e" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#030509" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Neon Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Radial Glow Orbs -->
    <radialGradient id="cyanOrb" cx="20%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleOrb" cx="80%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.5; filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.4)); }
        50% { opacity: 1; filter: drop-shadow(0 0 25px rgba(129, 140, 248, 0.8)); }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes beamSlide {
        0% { stroke-dashoffset: 1600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatBadge {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      .pulse-effect {
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .beam-path {
        stroke-dasharray: 200, 1400;
        animation: beamSlide 6s linear infinite;
      }
      .badge-float {
        animation: floatBadge 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="8" y="8" width="1184" height="304" rx="24" fill="url(#bgGrad)" />
  
  <!-- Cyber Grid Overlay -->
  <rect x="8" y="8" width="1184" height="304" rx="24" fill="url(#cyberGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="220" cy="140" r="220" fill="url(#cyanOrb)" />
  <circle cx="980" cy="180" r="220" fill="url(#purpleOrb)" />

  <!-- Card Border -->
  <rect x="8" y="8" width="1184" height="304" rx="24" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <!-- Animated Laser Beam around Border -->
  <rect x="8" y="8" width="1184" height="304" rx="24" fill="none" stroke="url(#borderGrad)" stroke-width="2" class="beam-path" />

  <!-- Top Terminal Bar -->
  <g transform="translate(36, 32)">
    <!-- Window Controls -->
    <circle cx="0" cy="0" r="6" fill="#ef4444" />
    <circle cx="18" cy="0" r="6" fill="#f59e0b" />
    <circle cx="36" cy="0" r="6" fill="#10b981" />

    <!-- Terminal Status Badge -->
    <g transform="translate(80, -11)">
      <rect x="0" y="0" width="220" height="22" rx="11" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <circle cx="12" cy="11" r="4" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="24" y="15" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">SYSTEM ACTIVE // 60 FPS</text>
    </g>

    <!-- Top Right Telemetry -->
    <text x="1080" y="4" text-anchor="end" fill="#64748b" font-family="monospace" font-size="11" letter-spacing="2">LATENCY &lt; 15MS • OFFLINE-READY</text>
  </g>

  <!-- Main Center Header Content -->
  <g transform="translate(600, 140)" text-anchor="middle">
    <!-- Sub-badge / Eyebrow -->
    <g transform="translate(0, -38)">
      <rect x="-160" y="-14" width="320" height="26" rx="13" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
      <text x="0" y="3" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2.5">AUTONOMOUS TRAVEL ARCHITECT</text>
    </g>

    <!-- Main Name Title -->
    <text x="0" y="24" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="46" font-weight="900" letter-spacing="5" class="pulse-effect">THRANAESWANTH S</text>

    <!-- Subtitle Description -->
    <text x="0" y="64" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" letter-spacing="1">Full-Stack Systems Engineer  •  Multi-LLM Orchestrator  •  Creator of PackWise AI</text>
  </g>

  <!-- Bottom Technology Pill Chips -->
  <g transform="translate(600, 260)" text-anchor="middle">
    <!-- React 19 -->
    <g transform="translate(-360, 0)">
      <rect x="-55" y="-14" width="110" height="28" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="0" y="4" fill="#61dafb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">⚡ React 19</text>
    </g>
    <!-- Vite 6 -->
    <g transform="translate(-230, 0)">
      <rect x="-50" y="-14" width="100" height="28" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="0" y="4" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">⚡ Vite 6</text>
    </g>
    <!-- Multi-LLM -->
    <g transform="translate(-95, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="0" y="4" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">🧠 Multi-LLM Core</text>
    </g>
    <!-- Dexie.js -->
    <g transform="translate(70, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="0" y="4" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">📶 Offline Dexie</text>
    </g>
    <!-- Capacitor 8 + Expo -->
    <g transform="translate(235, 0)">
      <rect x="-75" y="-14" width="150" height="28" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="0" y="4" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">📱 Mobile &amp; Expo</text>
    </g>
    <!-- Three.js 3D -->
    <g transform="translate(370, 0)">
      <rect x="-50" y="-14" width="100" height="28" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="0" y="4" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">🌐 3D Spatial</text>
    </g>
  </g>
</svg>
