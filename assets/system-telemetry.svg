<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="stBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0a1226" />
      <stop offset="100%" stop-color="#020409" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="stLaserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="1" />
      <stop offset="75%" stop-color="#c084fc" stop-opacity="1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="stGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.35" />
      <circle cx="30" cy="30" r="0.9" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <!-- Radial Glows -->
    <radialGradient id="glowCyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="radarSweepGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes beamCycle {
        0% { stroke-dashoffset: 2400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes radarSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes ecgPulse {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes beaconBlink {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
      @keyframes nodeFlow {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes badgeShimmer {
        0%, 100% { filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.3)); }
        50% { filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.6)); }
      }
      .laser-beam {
        stroke-dasharray: 260, 1800;
        animation: beamCycle 7s linear infinite;
      }
      .radar-sweep-arm {
        transform-origin: 1080px 105px;
        animation: radarSpin 4s linear infinite;
      }
      .ecg-line {
        stroke-dasharray: 120, 480;
        animation: ecgPulse 3.5s linear infinite;
      }
      .live-beacon {
        animation: beaconBlink 2s ease-in-out infinite;
      }
      .flow-circuit {
        stroke-dasharray: 6, 6;
        animation: nodeFlow 1.2s linear infinite;
      }
      .shimmer-card {
        animation: badgeShimmer 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Chassis Background -->
  <rect x="6" y="6" width="1188" height="348" rx="22" fill="url(#stBg)" />
  <rect x="6" y="6" width="1188" height="348" rx="22" fill="url(#stGrid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="120" r="180" fill="url(#glowCyan)" />
  <circle cx="950" cy="220" r="200" fill="url(#glowPurple)" />

  <!-- Chassis Border & Animated Laser Beam -->
  <rect x="6" y="6" width="1188" height="348" rx="22" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <rect x="6" y="6" width="1188" height="348" rx="22" fill="none" stroke="url(#stLaserGrad)" stroke-width="2" class="laser-beam" />

  <!-- Top Header Telemetry Bar -->
  <g transform="translate(32, 28)">
    <!-- Terminal Indicators -->
    <circle cx="0" cy="0" r="5" fill="#ef4444" />
    <circle cx="16" cy="0" r="5" fill="#f59e0b" />
    <circle cx="32" cy="0" r="5" fill="#10b981" />

    <!-- Title Badge -->
    <g transform="translate(68, -10)">
      <rect x="0" y="0" width="280" height="22" rx="11" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <circle cx="11" cy="11" r="3.5" fill="#10b981" class="live-beacon" />
      <text x="22" y="15" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5">REAL-TIME ARCHITECTURE RADAR</text>
    </g>

    <!-- Sub-status / Protocol -->
    <text x="1136" y="4" text-anchor="end" fill="#64748b" font-family="monospace" font-size="10.5" letter-spacing="2">TELEMETRY ENGINE • REVISION 2.4.0</text>
  </g>

  <!-- Left Half: Distributed Topology Mesh -->
  <g transform="translate(36, 68)">
    <!-- Section Eyebrow -->
    <text x="0" y="14" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="700" letter-spacing="2">ACTIVE TOPOLOGY MESH</text>

    <!-- Topology Node 1: Edge Client -->
    <g transform="translate(0, 32)">
      <rect x="0" y="0" width="190" height="84" rx="12" fill="#090d1a" stroke="#1e293b" stroke-width="1.2" />
      <rect x="0" y="0" width="190" height="3" rx="1.5" fill="#38bdf8" />
      <circle cx="20" cy="24" r="5" fill="#38bdf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="34" y="28" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Client PWA &amp; Dexie</text>
      <text x="16" y="50" fill="#94a3b8" font-family="monospace" font-size="9.5">Local IndexedDB Sync</text>
      <text x="16" y="68" fill="#10b981" font-family="monospace" font-size="9.5" font-weight="700">● 0ms Perceived Latency</text>
    </g>

    <!-- Bus Line 1 -> 2 -->
    <line x1="190" y1="74" x2="250" y2="74" stroke="#38bdf8" stroke-width="2" class="flow-circuit" />
    <circle cx="220" cy="74" r="3" fill="#38bdf8">
      <animate attributeName="cx" values="190;250" dur="1.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0" dur="1.4s" repeatCount="indefinite" />
    </circle>

    <!-- Topology Node 2: Resilient Gateway -->
    <g transform="translate(250, 32)">
      <rect x="0" y="0" width="190" height="84" rx="12" fill="#090d1a" stroke="#1e293b" stroke-width="1.2" />
      <rect x="0" y="0" width="190" height="3" rx="1.5" fill="#818cf8" />
      <circle cx="20" cy="24" r="5" fill="#818cf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite" />
      </circle>
      <text x="34" y="28" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Failover Router</text>
      <text x="16" y="50" fill="#94a3b8" font-family="monospace" font-size="9.5">Self-Healing Mesh</text>
      <text x="16" y="68" fill="#a855f7" font-family="monospace" font-size="9.5" font-weight="700">● Dynamic Auto-Switch</text>
    </g>

    <!-- Bus Line 2 -> 3 -->
    <line x1="440" y1="74" x2="500" y2="74" stroke="#a855f7" stroke-width="2" class="flow-circuit" />
    <circle cx="470" cy="74" r="3" fill="#c084fc">
      <animate attributeName="cx" values="440;500" dur="1.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0" dur="1.4s" repeatCount="indefinite" />
    </circle>

    <!-- Topology Node 3: Multi-LLM Intelligence Matrix -->
    <g transform="translate(500, 32)">
      <rect x="0" y="0" width="200" height="84" rx="12" fill="#090d1a" stroke="#1e293b" stroke-width="1.2" />
      <rect x="0" y="0" width="200" height="3" rx="1.5" fill="#c084fc" />
      <circle cx="20" cy="24" r="5" fill="#c084fc">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="34" y="28" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">LLM Ensemble</text>
      <text x="16" y="50" fill="#94a3b8" font-family="monospace" font-size="9.5">Gemini • Groq • GPT-4o</text>
      <text x="16" y="68" fill="#38bdf8" font-family="monospace" font-size="9.5" font-weight="700">● 99.99% Availability</text>
    </g>
  </g>

  <!-- Right Half: Live Radar Sweep & Oscilloscope Waveform -->
  <g transform="translate(770, 68)">
    <text x="0" y="14" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="700" letter-spacing="2">SYSTEM FREQUENCY &amp; SIGNAL</text>

    <!-- Oscilloscope Display Box -->
    <rect x="0" y="32" width="230" height="84" rx="12" fill="#050a14" stroke="#1e293b" stroke-width="1.2" />
    <!-- Oscilloscope grid lines -->
    <line x1="0" y1="74" x2="230" y2="74" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2, 4" />
    <line x1="115" y1="32" x2="115" y2="116" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2, 4" />

    <!-- Live Animated Sine/ECG Wave -->
    <path d="M 10 74 Q 30 74 45 60 T 65 74 T 85 92 T 100 44 T 115 104 T 130 68 T 150 74 T 180 74 T 220 74" fill="none" stroke="#38bdf8" stroke-width="2.2" class="ecg-line" />
    <text x="14" y="52" fill="#64748b" font-family="monospace" font-size="9">60.0 FPS SYNC</text>
    <text x="14" y="104" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="700">STABLE WAVE</text>

    <!-- Radar Scanner System -->
    <g transform="translate(310, 74)">
      <!-- Radar Target Circles -->
      <circle cx="0" cy="0" r="42" fill="#090d1a" stroke="#1e293b" stroke-width="1.2" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#1e293b" stroke-width="0.8" />
      <circle cx="0" cy="0" r="14" fill="none" stroke="#1e293b" stroke-width="0.8" />
      <line x1="-42" y1="0" x2="42" y2="0" stroke="#1e293b" stroke-width="0.8" />
      <line x1="0" y1="-42" x2="0" y2="42" stroke="#1e293b" stroke-width="0.8" />

      <!-- Radar Blips -->
      <circle cx="16" cy="-14" r="2.5" fill="#38bdf8">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" />
      </circle>
      <circle cx="-20" cy="18" r="2.5" fill="#10b981">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite" />
      </circle>

      <!-- Sweeping Arm with Gradient -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.5s" repeatCount="indefinite" />
        <path d="M 0 0 L 42 0 A 42 42 0 0 1 0 42 Z" fill="url(#glowCyan)" opacity="0.6" />
        <line x1="0" y1="0" x2="42" y2="0" stroke="#38bdf8" stroke-width="1.8" />
      </g>
      <circle cx="0" cy="0" r="3" fill="#ffffff" />
    </g>
  </g>

  <!-- Bottom Half: 4 Precision Metric HUD Counters -->
  <g transform="translate(36, 204)">
    <!-- Metric 1: State Mutation Latency -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="265" height="74" rx="12" fill="#080e1c" stroke="#1e293b" stroke-width="1.2" />
      <circle cx="22" cy="24" r="4" fill="#10b981" class="live-beacon" />
      <text x="36" y="28" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">STATE MUTATION LATENCY</text>
      <text x="22" y="58" fill="#38bdf8" font-family="monospace" font-size="24" font-weight="800">&lt; 4.0ms</text>
      <text x="135" y="55" fill="#10b981" font-family="monospace" font-size="10.5" font-weight="700">⚡ ZERO JANK</text>
    </g>

    <!-- Metric 2: 3D Spatial Frame Budget -->
    <g transform="translate(285, 0)">
      <rect x="0" y="0" width="265" height="74" rx="12" fill="#080e1c" stroke="#1e293b" stroke-width="1.2" />
      <circle cx="22" cy="24" r="4" fill="#38bdf8" class="live-beacon" />
      <text x="36" y="28" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">SPATIAL RENDER BUDGET</text>
      <text x="22" y="58" fill="#61dafb" font-family="monospace" font-size="24" font-weight="800">60 FPS</text>
      <text x="135" y="55" fill="#38bdf8" font-family="monospace" font-size="10.5" font-weight="700">🌐 LOCKED VSYNC</text>
    </g>

    <!-- Metric 3: LLM Failover Latency -->
    <g transform="translate(570, 0)">
      <rect x="0" y="0" width="265" height="74" rx="12" fill="#080e1c" stroke="#1e293b" stroke-width="1.2" />
      <circle cx="22" cy="24" r="4" fill="#a855f7" class="live-beacon" />
      <text x="36" y="28" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">AI FAILOVER SWITCHOVER</text>
      <text x="22" y="58" fill="#c084fc" font-family="monospace" font-size="24" font-weight="800">&lt; 240ms</text>
      <text x="145" y="55" fill="#a855f7" font-family="monospace" font-size="10.5" font-weight="700">🧠 SELF-HEAL</text>
    </g>

    <!-- Metric 4: Offline Cache Coverage -->
    <g transform="translate(855, 0)">
      <rect x="0" y="0" width="273" height="74" rx="12" fill="#080e1c" stroke="#1e293b" stroke-width="1.2" />
      <circle cx="22" cy="24" r="4" fill="#f59e0b" class="live-beacon" />
      <text x="36" y="28" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">OFFLINE CACHE COVERAGE</text>
      <text x="22" y="58" fill="#fbbf24" font-family="monospace" font-size="24" font-weight="800">100%</text>
      <text x="105" y="55" fill="#f59e0b" font-family="monospace" font-size="10.5" font-weight="700">📶 FULL DISCONNECTED</text>
    </g>
  </g>

  <!-- Bottom Cyber Ticker Ribbon -->
  <g transform="translate(36, 310)">
    <rect x="0" y="0" width="1128" height="24" rx="6" fill="#050811" stroke="#1e293b" stroke-width="0.8" />
    <circle cx="16" cy="12" r="3" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="16" fill="#94a3b8" font-family="monospace" font-size="10" letter-spacing="1">
      ENGINE STATUS: ACTIVE • DISTRIBUTED SYNC QUEUE VERIFIED • CRYPTOGRAPHIC JWT ROTATION LIVE • ZERO CRASHES
    </text>
    <text x="1114" y="16" text-anchor="end" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">
      THRANAESWANTH // SYSTEMS
    </text>
  </g>
</svg>
