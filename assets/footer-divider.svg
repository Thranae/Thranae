<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="100%" height="60" fill="none">
  <defs>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="20%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="1" />
      <stop offset="80%" stop-color="#c084fc" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="pulseDot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <style>
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.4); opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); }
      }
      .node-glow {
        animation: pulseNode 3s ease-in-out infinite;
        transform-origin: 600px 30px;
      }
    </style>
  </defs>

  <!-- Hairline Base -->
  <line x1="40" y1="30" x2="1160" y2="30" stroke="#1e293b" stroke-width="1" />

  <!-- Animated Glowing Segment -->
  <line x1="160" y1="30" x2="1040" y2="30" stroke="url(#dividerGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Center Diamond Anchor -->
  <g class="node-glow" transform="translate(600, 30)">
    <circle cx="0" cy="0" r="4" fill="url(#pulseDot)" />
    <circle cx="0" cy="0" r="8" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4" />
  </g>
</svg>
