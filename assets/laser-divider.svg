<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 50" width="100%" height="50" fill="none">
  <defs>
    <linearGradient id="laserBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="1" />
      <stop offset="75%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="centerNodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>

    <style>
      @keyframes beamSlide {
        0% { stroke-dashoffset: 800; }
        100% { stroke-dashoffset: -800; }
      }
      @keyframes nodePulse {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.6); opacity: 1; filter: drop-shadow(0 0 10px #38bdf8); }
      }
      .laser-travel {
        stroke-dasharray: 180, 620;
        animation: beamSlide 4s linear infinite;
      }
      .pulse-center {
        transform-origin: 600px 25px;
        animation: nodePulse 2.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Base Grid Line -->
  <line x1="60" y1="25" x2="1140" y2="25" stroke="#1e293b" stroke-width="1" />

  <!-- Animated High Speed Laser Beam -->
  <line x1="60" y1="25" x2="1140" y2="25" stroke="url(#laserBeamGrad)" stroke-width="2.5" stroke-linecap="round" class="laser-travel" />

  <!-- Central Micro Beacon -->
  <g class="pulse-center">
    <circle cx="600" cy="25" r="5" fill="#38bdf8" />
    <circle cx="600" cy="25" r="12" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.6" />
  </g>
</svg>
