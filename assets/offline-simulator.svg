<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="220" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="simBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040b" />
      <stop offset="50%" stop-color="#070e20" />
      <stop offset="100%" stop-color="#010307" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="simBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="30%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3" />
    </linearGradient>

    <style>
      @keyframes laserBorder {
        0% { stroke-dashoffset: 2000; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseDot {
        0% { stroke-dashoffset: 80; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes beaconBlink {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
      .laser-loop {
        stroke-dasharray: 220, 1400;
        animation: laserBorder 6s linear infinite;
      }
      .bus-flow {
        stroke-dasharray: 6, 6;
        animation: pulseDot 1.2s linear infinite;
      }
      .beacon-glow {
        animation: beaconBlink 1.8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Body -->
  <rect x="6" y="6" width="1188" height="208" rx="20" fill="url(#simBg)" />
  <rect x="6" y="6" width="1188" height="208" rx="20" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <rect x="6" y="6" width="1188" height="208" rx="20" fill="none" stroke="url(#simBorder)" stroke-width="2" class="laser-loop" />

  <!-- Top Terminal Bar -->
  <g transform="translate(32, 26)">
    <circle cx="0" cy="0" r="5" fill="#ef4444" />
    <circle cx="16" cy="0" r="5" fill="#f59e0b" />
    <circle cx="32" cy="0" r="5" fill="#10b981" />
    <text x="54" y="4" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1.5">
      OFFLINE-FIRST DISTRIBUTED STATE RECONCILIATION ENGINE
    </text>
    <text x="1136" y="4" text-anchor="end" fill="#64748b" font-family="monospace" font-size="10.5" letter-spacing="1.5">
      IN-FLIGHT / UNDERGROUND READY
    </text>
  </g>

  <!-- 4 Step Sequential Process Nodes -->
  <g transform="translate(48, 64)">
    <!-- Node 1: User Action / Mutation -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="240" height="88" rx="12" fill="#080e1c" stroke="#1e293b" stroke-width="1.2" />
      <rect x="0" y="0" width="240" height="3" rx="1.5" fill="#38bdf8" />
      <circle cx="20" cy="22" r="4.5" fill="#38bdf8" class="beacon-glow" />
      <text x="34" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">1. Instant Mutation</text>
      <text x="16" y="48" fill="#94a3b8" font-family="monospace" font-size="10">User edits trip / budget</text>
      <text x="16" y="68" fill="#10b981" font-family="monospace" font-size="10" font-weight="700">⚡ 0ms Perceived Latency</text>
    </g>

    <!-- Connector 1 -> 2 -->
    <line x1="240" y1="44" x2="285" y2="44" stroke="#38bdf8" stroke-width="2" class="bus-flow" />

    <!-- Node 2: Dexie.js Local-First Store -->
    <g transform="translate(285, 0)">
      <rect x="0" y="0" width="240" height="88" rx="12" fill="#080e1c" stroke="#1e293b" stroke-width="1.2" />
      <rect x="0" y="0" width="240" height="3" rx="1.5" fill="#f59e0b" />
      <circle cx="20" cy="22" r="4.5" fill="#f59e0b" class="beacon-glow" />
      <text x="34" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">2. Dexie.js IndexedDB</text>
      <text x="16" y="48" fill="#94a3b8" font-family="monospace" font-size="10">Local browser persistence</text>
      <text x="16" y="68" fill="#f59e0b" font-family="monospace" font-size="10" font-weight="700">💾 Committed in &lt; 3.8ms</text>
    </g>

    <!-- Connector 2 -> 3 -->
    <line x1="525" y1="44" x2="570" y2="44" stroke="#f59e0b" stroke-width="2" class="bus-flow" />

    <!-- Node 3: Idempotent Queue -->
    <g transform="translate(570, 0)">
      <rect x="0" y="0" width="240" height="88" rx="12" fill="#080e1c" stroke="#1e293b" stroke-width="1.2" />
      <rect x="0" y="0" width="240" height="3" rx="1.5" fill="#a855f7" />
      <circle cx="20" cy="22" r="4.5" fill="#a855f7" class="beacon-glow" />
      <text x="34" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">3. Idempotent Sync Queue</text>
      <text x="16" y="48" fill="#94a3b8" font-family="monospace" font-size="10">Guaranteed order &amp; dedupe</text>
      <text x="16" y="68" fill="#c084fc" font-family="monospace" font-size="10" font-weight="700">🔒 Zero Data Loss At 38K FT</text>
    </g>

    <!-- Connector 3 -> 4 -->
    <line x1="810" y1="44" x2="855" y2="44" stroke="#a855f7" stroke-width="2" class="bus-flow" />

    <!-- Node 4: Remote Atlas Cloud Reconciler -->
    <g transform="translate(855, 0)">
      <rect x="0" y="0" width="245" height="88" rx="12" fill="#080e1c" stroke="#1e293b" stroke-width="1.2" />
      <rect x="0" y="0" width="245" height="3" rx="1.5" fill="#10b981" />
      <circle cx="20" cy="22" r="4.5" fill="#10b981" class="beacon-glow" />
      <text x="34" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">4. Gateway Reconciler</text>
      <text x="16" y="48" fill="#94a3b8" font-family="monospace" font-size="10">Replays on network rejoin</text>
      <text x="16" y="68" fill="#10b981" font-family="monospace" font-size="10" font-weight="700">☁️ MongoDB Atlas Sync</text>
    </g>
  </g>

  <!-- Bottom Metric Ticker -->
  <g transform="translate(48, 172)">
    <rect x="0" y="0" width="1100" height="24" rx="6" fill="#040712" stroke="#1e293b" stroke-width="0.8" />
    <circle cx="16" cy="12" r="3" fill="#10b981" />
    <text x="28" y="16" fill="#94a3b8" font-family="monospace" font-size="9.5">
      NETWORK INDEPENDENT • TESTED AT 38,000 FT (IN-FLIGHT MODE) • BACKGROUND WORKBOX SYNC ACTIVE • DETERMINISTIC CONSISTENCY
    </text>
    <text x="1086" y="16" text-anchor="end" fill="#38bdf8" font-family="monospace" font-size="9.5" font-weight="700">
      0% PACKET DEPENDENCY
    </text>
  </g>
</svg>
