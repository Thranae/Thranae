<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="380" fill="none">
  <defs>
    <!-- Deep Space Background Gradient -->
    <linearGradient id="orbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02050e" />
      <stop offset="45%" stop-color="#060c1d" />
      <stop offset="100%" stop-color="#010307" />
    </linearGradient>

    <!-- Laser Border Gradient -->
    <linearGradient id="orbBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="30%" stop-color="#818cf8" stop-opacity="1" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3" />
    </linearGradient>

    <!-- Globe Glow Gradient -->
    <radialGradient id="globeAtmosphere" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#1e3a5f" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#060c1d" stop-opacity="0" />
    </radialGradient>

    <!-- Orbit Ring Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8" />
    </linearGradient>

    <!-- Flight Arc Gradient -->
    <linearGradient id="flightArcGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Cyber Grid Background -->
    <pattern id="orbGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.35" />
      <circle cx="32" cy="32" r="0.8" fill="#38bdf8" fill-opacity="0.2" />
    </pattern>

    <!-- Keyframe Animations -->
    <style>
      @keyframes borderLaser {
        0% { stroke-dashoffset: 2600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes orbitTravel {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes flightPulse {
        0% { stroke-dashoffset: 320; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes beaconBlink {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.5); opacity: 0.4; }
      }
      @keyframes starTwinkle {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 0.9; }
      }
      .laser-chassis {
        stroke-dasharray: 280, 1900;
        animation: borderLaser 7s linear infinite;
      }
      .orbit-path {
        stroke-dasharray: 12, 10;
        animation: orbitTravel 4s linear infinite;
      }
      .flight-beam-1 {
        stroke-dasharray: 40, 260;
        animation: flightPulse 3s linear infinite;
      }
      .flight-beam-2 {
        stroke-dasharray: 50, 220;
        animation: flightPulse 2.4s linear infinite;
      }
      .waypoint-beacon {
        animation: beaconBlink 2.2s ease-in-out infinite;
      }
      .twinkle-star {
        animation: starTwinkle 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Chassis Body -->
  <rect x="6" y="6" width="1188" height="368" rx="22" fill="url(#orbBg)" />
  <rect x="6" y="6" width="1188" height="368" rx="22" fill="url(#orbGrid)" />

  <!-- Chassis Border with Laser Animation -->
  <rect x="6" y="6" width="1188" height="368" rx="22" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <rect x="6" y="6" width="1188" height="368" rx="22" fill="none" stroke="url(#orbBorderGrad)" stroke-width="2" class="laser-chassis" />

  <!-- Background Ambient Starfield -->
  <circle cx="70" cy="80" r="1.2" fill="#38bdf8" class="twinkle-star" />
  <circle cx="150" cy="40" r="1" fill="#818cf8" class="twinkle-star" style="animation-delay: 1s;" />
  <circle cx="450" cy="90" r="1.5" fill="#ffffff" class="twinkle-star" style="animation-delay: 1.5s;" />
  <circle cx="530" cy="50" r="1.2" fill="#38bdf8" class="twinkle-star" style="animation-delay: 0.5s;" />
  <circle cx="1120" cy="90" r="1.2" fill="#c084fc" class="twinkle-star" style="animation-delay: 2s;" />
  <circle cx="1060" cy="40" r="1" fill="#38bdf8" class="twinkle-star" style="animation-delay: 0.8s;" />
  <circle cx="80" cy="320" r="1.2" fill="#818cf8" class="twinkle-star" style="animation-delay: 1.2s;" />

  <!-- Top Title Ribbon -->
  <g transform="translate(32, 28)">
    <circle cx="0" cy="0" r="5" fill="#ef4444" />
    <circle cx="16" cy="0" r="5" fill="#f59e0b" />
    <circle cx="32" cy="0" r="5" fill="#10b981" />
    
    <g transform="translate(64, -10)">
      <rect x="0" y="0" width="310" height="22" rx="11" fill="#0b1329" stroke="#1e3a5f" stroke-width="1" />
      <circle cx="11" cy="11" r="3.5" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="22" y="15" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5">SPATIAL TRAVEL MATRIX // 3D CORE</text>
    </g>

    <text x="1136" y="4" text-anchor="end" fill="#64748b" font-family="monospace" font-size="10.5" letter-spacing="2">60 FPS SPATIAL ENGINE • OFFLINE FIRST</text>
  </g>

  <!-- ==================== LEFT: 3D CYBER TRAVEL GLOBE ==================== -->
  <g transform="translate(230, 205)">
    <!-- Atmosphere Glow -->
    <circle cx="0" cy="0" r="130" fill="url(#globeAtmosphere)" />

    <!-- Outer Globe Rim -->
    <circle cx="0" cy="0" r="105" fill="#040914" stroke="#1e3a5f" stroke-width="1.6" />

    <!-- Latitudinal Wireframe Rings (3D Perspective) -->
    <ellipse cx="0" cy="0" rx="105" ry="32" fill="none" stroke="#2563eb" stroke-width="1.2" opacity="0.7" />
    <ellipse cx="0" cy="-42" rx="96" ry="24" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.6" />
    <ellipse cx="0" cy="42" rx="96" ry="24" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.6" />
    <ellipse cx="0" cy="-75" rx="72" ry="16" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.45" />
    <ellipse cx="0" cy="75" rx="72" ry="16" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.45" />

    <!-- Longitudinal Meridians (Curved 3D Spherical Slices) -->
    <ellipse cx="0" cy="0" rx="30" ry="105" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.65" />
    <ellipse cx="0" cy="0" rx="68" ry="105" fill="none" stroke="#1e3a5f" stroke-width="1" opacity="0.6" />
    <ellipse cx="0" cy="0" rx="96" ry="105" fill="none" stroke="#1e293b" stroke-width="0.9" opacity="0.5" />
    <line x1="0" y1="-105" x2="0" y2="105" stroke="#38bdf8" stroke-width="1.2" opacity="0.7" />

    <!-- Tilted Equatorial Orbit Ring -->
    <g transform="rotate(-28)">
      <ellipse cx="0" cy="0" rx="142" ry="46" fill="none" stroke="url(#orbitGrad)" stroke-width="1.8" class="orbit-path" />
      <!-- Orbiting Satellite Indicator -->
      <circle cx="142" cy="0" r="4" fill="#38bdf8">
        <animate attributeName="fill" values="#38bdf8;#c084fc;#38bdf8" dur="3s" repeatCount="indefinite" />
      </circle>
      <circle cx="142" cy="0" r="8" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.5" />
    </g>

    <!-- Transcontinental Great-Circle Flight Trajectory Arcs -->
    <!-- Flight Arc 1: SFO -> TYO -->
    <path d="M -70 20 Q -25 -70 45 -30" fill="none" stroke="#1e3a5f" stroke-width="2.5" />
    <path d="M -70 20 Q -25 -70 45 -30" fill="none" stroke="url(#flightArcGrad1)" stroke-width="2.5" stroke-linecap="round" class="flight-beam-1" />

    <!-- Flight Arc 2: TYO -> BLR -->
    <path d="M 45 -30 Q 55 10 15 45" fill="none" stroke="#1e3a5f" stroke-width="2" />
    <path d="M 45 -30 Q 55 10 15 45" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" class="flight-beam-2" />

    <!-- Flight Arc 3: BLR -> CDG -->
    <path d="M 15 45 Q -20 15 -35 -40" fill="none" stroke="#1e3a5f" stroke-width="1.8" />
    <path d="M 15 45 Q -20 15 -35 -40" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" class="flight-beam-1" />

    <!-- Waypoint 1: SFO (San Francisco) -->
    <g transform="translate(-70, 20)">
      <circle cx="0" cy="0" r="3.5" fill="#38bdf8" />
      <circle cx="0" cy="0" r="7" fill="none" stroke="#38bdf8" stroke-width="1" class="waypoint-beacon" />
      <rect x="-38" y="-18" width="34" height="15" rx="4" fill="#091224" stroke="#1e3a5f" stroke-width="0.8" />
      <text x="-21" y="-8" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="8.5" font-weight="700">SFO</text>
    </g>

    <!-- Waypoint 2: TYO (Tokyo) -->
    <g transform="translate(45, -30)">
      <circle cx="0" cy="0" r="3.5" fill="#f59e0b" />
      <circle cx="0" cy="0" r="7" fill="none" stroke="#f59e0b" stroke-width="1" class="waypoint-beacon" />
      <rect x="6" y="-18" width="34" height="15" rx="4" fill="#091224" stroke="#1e3a5f" stroke-width="0.8" />
      <text x="23" y="-8" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="8.5" font-weight="700">TYO</text>
    </g>

    <!-- Waypoint 3: BLR (Bengaluru) -->
    <g transform="translate(15, 45)">
      <circle cx="0" cy="0" r="3.5" fill="#10b981" />
      <circle cx="0" cy="0" r="7" fill="none" stroke="#10b981" stroke-width="1" class="waypoint-beacon" />
      <rect x="6" y="4" width="34" height="15" rx="4" fill="#091224" stroke="#1e3a5f" stroke-width="0.8" />
      <text x="23" y="14" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="8.5" font-weight="700">BLR</text>
    </g>

    <!-- Waypoint 4: CDG (Paris) -->
    <g transform="translate(-35, -40)">
      <circle cx="0" cy="0" r="3.5" fill="#c084fc" />
      <circle cx="0" cy="0" r="7" fill="none" stroke="#c084fc" stroke-width="1" class="waypoint-beacon" />
      <rect x="-40" y="-18" width="36" height="15" rx="4" fill="#091224" stroke="#1e3a5f" stroke-width="0.8" />
      <text x="-22" y="-8" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="8.5" font-weight="700">CDG</text>
    </g>

    <!-- Globe Center Core Label -->
    <g transform="translate(0, 126)">
      <rect x="-90" y="0" width="180" height="20" rx="10" fill="#080e1c" stroke="#1e3a5f" stroke-width="1" />
      <circle cx="-75" cy="10" r="3" fill="#10b981">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite" />
      </circle>
      <text x="-65" y="14" fill="#94a3b8" font-family="monospace" font-size="9" font-weight="700">FLIGHT VECTOR RADAR</text>
    </g>
  </g>

  <!-- ==================== RIGHT: AUTONOMOUS TRAVEL INTELLIGENCE ARCHITECTURE ==================== -->
  <g transform="translate(480, 68)">
    <!-- Header Callout -->
    <text x="0" y="16" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="900" letter-spacing="1">
      Autonomous Travel Intelligence Core
    </text>
    <text x="0" y="38" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
      Engineered for offline flight transit • Multi-LLM self-healing orchestration • 60 FPS WebGL spatial computing
    </text>

    <!-- 3 Bento Feature Cards -->
    <!-- Card 1: 38,000 FT Offline Resilience -->
    <g transform="translate(0, 56)">
      <rect x="0" y="0" width="670" height="66" rx="12" fill="#090f20" stroke="#1e293b" stroke-width="1.2" />
      <circle cx="28" cy="33" r="14" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1" />
      <!-- Airplane icon -->
      <path d="M 22 33 L 28 26 L 31 27 L 29 32 L 35 33 L 36 31 L 38 31 L 37 35 L 28 35 Z" fill="#38bdf8" />
      <text x="56" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">
        Subway &amp; In-Flight Zero-Packet Autonomy
      </text>
      <text x="56" y="46" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">
        Commits state locally to Dexie.js (IndexedDB) in &lt; 4ms. Reconciles seamlessly upon reconnecting.
      </text>
      <g transform="translate(565, 20)">
        <rect x="0" y="0" width="90" height="26" rx="8" fill="#0e1f38" stroke="#2563eb" stroke-width="1" />
        <text x="45" y="17" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">0ms JANK</text>
      </g>
    </g>

    <!-- Card 2: Multi-LLM Self-Healing Failover Router -->
    <g transform="translate(0, 132)">
      <rect x="0" y="0" width="670" height="66" rx="12" fill="#090f20" stroke="#1e293b" stroke-width="1.2" />
      <circle cx="28" cy="33" r="14" fill="rgba(168, 85, 247, 0.12)" stroke="#a855f7" stroke-width="1" />
      <!-- Brain/AI icon -->
      <circle cx="28" cy="33" r="5" fill="#a855f7" />
      <circle cx="23" cy="30" r="2.5" fill="#c084fc" />
      <circle cx="33" cy="30" r="2.5" fill="#c084fc" />
      <circle cx="28" cy="38" r="2.5" fill="#c084fc" />
      <text x="56" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">
        Multi-LLM Dynamic Failover Matrix
      </text>
      <text x="56" y="46" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">
        Gemini 2.5 Flash for JSON itineraries, Groq for sub-300ms chat, auto-routing to GPT-4o &amp; Mistral.
      </text>
      <g transform="translate(545, 20)">
        <rect x="0" y="0" width="110" height="26" rx="8" fill="#1e1338" stroke="#7c3aed" stroke-width="1" />
        <text x="55" y="17" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="10" font-weight="700">&lt; 240ms FAILOVER</text>
      </g>
    </g>

    <!-- Card 3: Tri-Platform 60 FPS Native Runtime -->
    <g transform="translate(0, 208)">
      <rect x="0" y="0" width="670" height="66" rx="12" fill="#090f20" stroke="#1e293b" stroke-width="1.2" />
      <circle cx="28" cy="33" r="14" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="1" />
      <!-- Mobile / Spatial chip icon -->
      <rect x="23" y="27" width="10" height="12" rx="2" fill="none" stroke="#10b981" stroke-width="1.2" />
      <line x1="26" y1="36" x2="30" y2="36" stroke="#10b981" stroke-width="1" />
      <text x="56" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">
        Tri-Platform Universal Codebase (Web, iOS, Android)
      </text>
      <text x="56" y="46" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">
        Shared business logic across React 19 PWA, Capacitor 8 native, and Expo with 60 FPS Three.js canvas.
      </text>
      <g transform="translate(555, 20)">
        <rect x="0" y="0" width="100" height="26" rx="8" fill="#0d281e" stroke="#059669" stroke-width="1" />
        <text x="50" y="17" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="10" font-weight="700">60 FPS LOCKED</text>
      </g>
    </g>
  </g>

  <!-- Bottom Telemetry Ticker Strip -->
  <g transform="translate(36, 335)">
    <rect x="0" y="0" width="1128" height="22" rx="6" fill="#050811" stroke="#1e293b" stroke-width="0.8" />
    <circle cx="16" cy="11" r="3" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="15" fill="#94a3b8" font-family="monospace" font-size="9.5" letter-spacing="1">
      SYSTEM MATRIX: ACTIVE • 12,000+ FLIGHT PATH VECTORS • CRYPTOGRAPHIC TOKEN ROTATION • ZERO CLOUD LOCK-IN
    </text>
    <text x="1114" y="15" text-anchor="end" fill="#38bdf8" font-family="monospace" font-size="9.5" font-weight="700">
      THRANAESWANTH // PACKWISE ARCHITECTURE
    </text>
  </g>
</svg>
